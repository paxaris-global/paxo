name: Central Docker Image Builder

on:
  repository_dispatch:
    types: [build-image]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout triggered repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.ref_name || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Detect project type
        id: detect
        run: |
          if [ -f pom.xml ]; then
            echo "project_type=maven" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ] && [ -f Dockerfile ]; then
            echo "project_type=frontend" >> "$GITHUB_OUTPUT"
          elif [ -f requirements.txt ] && [ -f Dockerfile ]; then
            echo "project_type=python" >> "$GITHUB_OUTPUT"
          else
            echo "project_type=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve frontend Docker repository
        id: frontend-image
        if: ${{ steps.detect.outputs.project_type == 'frontend' }}
        run: |
          PAYLOAD_REPO='${{ github.event.client_payload.docker_repository }}'
          if [ -n "$PAYLOAD_REPO" ]; then
            IMAGE_REPO="$PAYLOAD_REPO"
          else
            REPO_NAME='${{ github.event.client_payload.repo }}'
            IMAGE_REPO="devopspaxarisglobalrepo/$(echo "$REPO_NAME" | awk -F/ '{print tolower($2)}')"
          fi
          echo "image_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"

      - name: Resolve python Docker repository
        id: python-image
        if: ${{ steps.detect.outputs.project_type == 'python' }}
        run: |
          PAYLOAD_REPO='${{ github.event.client_payload.docker_repository }}'
          if [ -n "$PAYLOAD_REPO" ]; then
            IMAGE_REPO="$PAYLOAD_REPO"
          else
            REPO_NAME='${{ github.event.client_payload.repo }}'
            IMAGE_REPO="devopspaxarisglobalrepo/$(echo "$REPO_NAME" | awk -F/ '{print tolower($2)}')"
          fi
          echo "image_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 with Maven cache
        if: ${{ steps.detect.outputs.project_type == 'maven' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build using Maven
        if: ${{ steps.detect.outputs.project_type == 'maven' }}
        run: mvn -B clean package -DskipTests

      - name: SonarQube Scan
        if: ${{ steps.detect.outputs.project_type == 'maven' && env.SONAR_TOKEN != '' }}
        run: |
          PROJECT_KEY=$(echo "${{ github.event.client_payload.repo }}" | tr '/' '_')
          mvn -B sonar:sonar \
            -DskipTests \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.projectKey="${PROJECT_KEY}" \
            -Dsonar.projectName="${{ github.event.client_payload.repo }}"

      - name: SonarQube Quality Gate
        if: ${{ steps.detect.outputs.project_type == 'maven' && env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 10
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: SonarQube Skipped (missing token)
        if: ${{ steps.detect.outputs.project_type == 'maven' && env.SONAR_TOKEN == '' }}
        run: echo "Skipping SonarQube because SONAR_TOKEN secret is not configured."

      - name: Docker Hub Login
        if: ${{ steps.detect.outputs.project_type == 'maven' || steps.detect.outputs.project_type == 'frontend' || steps.detect.outputs.project_type == 'python' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push Image (Jib)
        if: ${{ steps.detect.outputs.project_type == 'maven' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          IMAGE_SHA_TAG="${{ github.event.client_payload.sha || github.sha }}"
          mvn -B jib:build -DskipTests -Djib.to.tags=latest,${IMAGE_SHA_TAG}

      - name: Set up Docker Buildx
        if: ${{ steps.detect.outputs.project_type == 'frontend' }}
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Image
        if: ${{ steps.detect.outputs.project_type == 'frontend' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.frontend-image.outputs.image_repo }}:latest
            ${{ steps.frontend-image.outputs.image_repo }}:${{ github.event.client_payload.sha || github.sha }}

      - name: Build & Push Python Image
        if: ${{ steps.detect.outputs.project_type == 'python' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.python-image.outputs.image_repo }}:latest
            ${{ steps.python-image.outputs.image_repo }}:${{ github.event.client_payload.sha || github.sha }}

      - name: Update GitOps manifests in paxo
        if: ${{ steps.detect.outputs.project_type == 'maven' || steps.detect.outputs.project_type == 'frontend' || steps.detect.outputs.project_type == 'python' }}
        env:
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          REPO_FULL='${{ github.event.client_payload.repo }}'
          IMAGE_SHA='${{ github.event.client_payload.sha || github.sha }}'

          DEPLOYMENT_FILE=""
          TARGET_IMAGE=""

          case "$REPO_FULL" in
            paxaris-global/api-gateway)
              DEPLOYMENT_FILE="k8/api-gateway-deployment.yaml"
              TARGET_IMAGE="devopspaxarisglobalrepo/apigateway:${IMAGE_SHA}"
              ;;
            paxaris-global/identity_service|paxaris-global/identity-service)
              DEPLOYMENT_FILE="k8/identity-service-deployment.yaml"
              TARGET_IMAGE="devopspaxarisglobalrepo/identity-service:${IMAGE_SHA}"
              ;;
            paxaris-global/product-management-service)
              DEPLOYMENT_FILE="k8/product-management-service-deployment.yaml"
              TARGET_IMAGE="devopspaxarisglobalrepo/product-management-service:${IMAGE_SHA}"
              ;;
            paxaris-global/paxo_frontend)
              DEPLOYMENT_FILE="k8/paxo-frontend-deployment.yaml"
              TARGET_IMAGE="devopspaxarisglobalrepo/paxo_frontend:${IMAGE_SHA}"
              ;;
            paxaris-global/python_foundry)
              DEPLOYMENT_FILE="k8/python-foundry-stack.yaml"
              TARGET_IMAGE="devopspaxarisglobalrepo/python_foundry:${IMAGE_SHA}"
              ;;
            *)
              echo "No GitOps deployment mapping configured for $REPO_FULL."
              exit 0
              ;;
          esac

          git clone "https://x-access-token:${GH_ACCESS_TOKEN}@github.com/paxaris-global/paxo.git" /tmp/paxo-gitops
          cd /tmp/paxo-gitops

          if [ "$REPO_FULL" = "paxaris-global/python_foundry" ]; then
            # Update both API and worker container images in the stack file.
            sed -i "s|^\([[:space:]]*image:[[:space:]]*\\)\"*devopspaxarisglobalrepo/python_foundry:[^\"]*\"*|\\1\"${TARGET_IMAGE}\"|" "$DEPLOYMENT_FILE"
          else
            sed -i "s|^\([[:space:]]*image:[[:space:]]*\).*|\1${TARGET_IMAGE}|" "$DEPLOYMENT_FILE"
          fi

          if git diff --quiet; then
            echo "No manifest change detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEPLOYMENT_FILE"
          git commit -m "ci: update image for ${REPO_FULL} to ${IMAGE_SHA}"
          git push origin main

      - name: Unsupported repository type
        if: ${{ steps.detect.outputs.project_type == 'unknown' }}
        run: |
          echo "Unsupported repository type for ${{ github.event.client_payload.repo }}"
          exit 1
