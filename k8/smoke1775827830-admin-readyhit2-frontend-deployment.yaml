apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke1775827830-admin-readyhit2-frontend
  annotations:
    argocd-image-updater.argoproj.io/image-list: devopspaxarisglobalrepo/smoke1775827830-admin-readyhit2-frontend
    argocd-image-updater.argoproj.io/smoke1775827830-admin-readyhit2-frontend.update-strategy: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smoke1775827830-admin-readyhit2-frontend
  template:
    metadata:
      labels:
        app: smoke1775827830-admin-readyhit2-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: smoke1775827830-admin-readyhit2-frontend
          image: devopspaxarisglobalrepo/smoke1775827830-admin-readyhit2-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: smoke1775827830-admin-readyhit2-frontend
spec:
  selector:
    app: smoke1775827830-admin-readyhit2-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
