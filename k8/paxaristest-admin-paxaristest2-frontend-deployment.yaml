apiVersion: apps/v1
kind: Deployment
metadata:
  name: paxaristest-admin-paxaristest2-frontend
  annotations:
    argocd-image-updater.argoproj.io/image-list: devopspaxarisglobalrepo/paxaristest-admin-paxaristest2-frontend
    argocd-image-updater.argoproj.io/paxaristest-admin-paxaristest2-frontend.update-strategy: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paxaristest-admin-paxaristest2-frontend
  template:
    metadata:
      labels:
        app: paxaristest-admin-paxaristest2-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: paxaristest-admin-paxaristest2-frontend
          image: devopspaxarisglobalrepo/paxaristest-admin-paxaristest2-frontend-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: paxaristest-admin-paxaristest2-frontend
spec:
  selector:
    app: paxaristest-admin-paxaristest2-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
