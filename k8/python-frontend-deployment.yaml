apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-frontend
spec:
  selector:
    matchLabels:
      app: python-frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: python-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: python-frontend
          image: devopspaxarisglobalrepo/python_foundry_frontend:3177dc249ff28083ed29e5d3b50e7328c347c915
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: python-frontend
spec:
  selector:
    app: python-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32081
  type: NodePort
