apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  selector:
    matchLabels:
      app: jaeger
  replicas: 1
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: "jaegertracing/all-in-one:1.62.0"
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: web
      port: 16686
      targetPort: 16686
      nodePort: 31686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      nodePort: 30417
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30418
  type: NodePort
