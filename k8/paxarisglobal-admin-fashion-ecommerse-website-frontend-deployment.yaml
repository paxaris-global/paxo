apiVersion: apps/v1
kind: Deployment
metadata:
  name: paxarisglobal-admin-fashion-ecommerse-website-frontend
  annotations:
    argocd-image-updater.argoproj.io/image-list: "app=devopspaxarisglobalrepo/paxarisglobal-admin-fashion-ecommerse-website-frontend"
    argocd-image-updater.argoproj.io/app.update-strategy: latest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paxarisglobal-admin-fashion-ecommerse-website-frontend
  template:
    metadata:
      labels:
        app: paxarisglobal-admin-fashion-ecommerse-website-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: paxarisglobal-admin-fashion-ecommerse-website-frontend
          image: "devopspaxarisglobalrepo/paxarisglobal-admin-fashion-ecommerse-website-frontend:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: paxarisglobal-admin-fashion-ecommerse-website-frontend
spec:
  selector:
    app: paxarisglobal-admin-fashion-ecommerse-website-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32101
  type: NodePort
