# Copy to paxarisglobal-realm-admin-secret.yaml, set password, apply once:
#   kubectl apply -f paxo/k8/paxarisglobal-realm-admin-secret.yaml
# Password must match the realm admin password from Paxo signup (Users tab login).
apiVersion: v1
kind: Secret
metadata:
  name: paxarisglobal-realm-admin
type: Opaque
stringData:
  password: "REPLACE_WITH_PAXO_REALM_ADMIN_PASSWORD"
