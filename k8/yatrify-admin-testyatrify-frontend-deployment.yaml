apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatrify-admin-testyatrify-frontend
  annotations:
    argocd-image-updater.argoproj.io/image-list: "app=devopspaxarisglobalrepo/yatrify-admin-testyatrify-frontend"
    argocd-image-updater.argoproj.io/app.update-strategy: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatrify-admin-testyatrify-frontend
  template:
    metadata:
      labels:
        app: yatrify-admin-testyatrify-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: yatrify-admin-testyatrify-frontend
          image: "devopspaxarisglobalrepo/yatrify-admin-testyatrify-frontend:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: yatrify-admin-testyatrify-frontend
spec:
  selector:
    app: yatrify-admin-testyatrify-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32102
  type: NodePort
