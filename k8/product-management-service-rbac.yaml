# Lets product-management-service discover *-frontend Services for the home-page catalog.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: product-management-service-catalog-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: product-management-service-catalog-reader
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: product-management-service-catalog-reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
