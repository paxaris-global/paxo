apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto1775829251-admin-autofront-backend
  annotations:
    argocd-image-updater.argoproj.io/image-list: devopspaxarisglobalrepo/auto1775829251-admin-autofront-backend
    argocd-image-updater.argoproj.io/auto1775829251-admin-autofront-backend.update-strategy: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auto1775829251-admin-autofront-backend
  template:
    metadata:
      labels:
        app: auto1775829251-admin-autofront-backend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: auto1775829251-admin-autofront-backend
          image: devopspaxarisglobalrepo/auto1775829251-admin-autofront-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
---
apiVersion: v1
kind: Service
metadata:
  name: auto1775829251-admin-autofront-backend
spec:
  selector:
    app: auto1775829251-admin-autofront-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
