apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paxaris-global/paxo.git
    targetRevision: main
    path: k8/generated-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
