apiVersion: apps/v1
kind: Deployment
metadata:
  name: test_vipul-admin-test7-test7-vipul7-backend
  annotations:
    argocd-image-updater.argoproj.io/image-list: devopspaxarisglobalrepo/test_vipul-admin-test7-test7-vipul7-backend
    argocd-image-updater.argoproj.io/test_vipul-admin-test7-test7-vipul7-backend.update-strategy: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test_vipul-admin-test7-test7-vipul7-backend
  template:
    metadata:
      labels:
        app: test_vipul-admin-test7-test7-vipul7-backend
    spec:
      containers:
        - name: test_vipul-admin-test7-test7-vipul7-backend
          image: devopspaxarisglobalrepo/test_vipul-admin-test7-test7-vipul7-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
---
apiVersion: v1
kind: Service
metadata:
  name: test_vipul-admin-test7-test7-vipul7-backend
spec:
  selector:
    app: test_vipul-admin-test7-test7-vipul7-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
