apiVersion: apps/v1
kind: Deployment
metadata:
  name: setmeup-admin-ecomerence23-frontend
  annotations:
    argocd-image-updater.argoproj.io/image-list: "app=paxarisdocker/setmeup-admin-ecomerence23-frontend"
    argocd-image-updater.argoproj.io/app.update-strategy: latest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: setmeup-admin-ecomerence23-frontend
  template:
    metadata:
      labels:
        app: setmeup-admin-ecomerence23-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: setmeup-admin-ecomerence23-frontend
          image: "paxarisdocker/setmeup-admin-ecomerence23-frontend:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: setmeup-admin-ecomerence23-frontend
spec:
  selector:
    app: setmeup-admin-ecomerence23-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32100
  type: NodePort
