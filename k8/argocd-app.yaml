apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paxo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/paxaris-global/paxo.git'
    targetRevision: main
    path: k8
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default # Or your target namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
