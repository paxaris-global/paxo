apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paxo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/paxaris-global' # Set this once to your repo
    targetRevision: main
    path: paxo/k8 # Path to your k8s manifests (update if needed)
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default # Or your target namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
