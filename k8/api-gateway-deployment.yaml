apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  selector:
    matchLabels:
      app: api-gateway
  replicas: 1
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: devopspaxarisglobalrepo/apigateway:v1.1.2
          ports:
            - containerPort: 8085
          env:
            - name: PROJECT_MANAGEMENT_BASE_URL
              value: http://product-management-service:8088
            - name: IDENTITY_SERVICE_URL
              value: http://identity-service:8087
            - name: KEYCLOAK_BASE_URL
              value: http://keycloak-server:8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8085
      targetPort: 8085
      nodePort: 32085
  type: NodePort
