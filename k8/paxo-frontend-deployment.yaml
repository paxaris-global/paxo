apiVersion: apps/v1
kind: Deployment
metadata:
  name: paxo-frontend
spec:
  selector:
    matchLabels:
      app: paxo-frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: paxo-frontend
      annotations:
        # Bump when paxo_frontend image tag stays :latest so Argo rolls pods after CI pushes.
        paxaris.gitops/redeploy-at: "2026-05-22T12:33:05Z"
        paxaris.gitops/frontend-revision: "175aedd1"
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: paxo-frontend
          image: devopspaxarisglobalrepo/paxo_frontend:175aedd17e4cecb5105a1d3cad61023c07ed460d
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: paxo-frontend
spec:
  selector:
    app: paxo-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
