apiVersion: apps/v1
kind: Deployment
metadata:
  name: paxo-frontend
spec:
  selector:
    matchLabels:
      app: paxo-frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: paxo-frontend
      annotations:
        # Bump when paxo_frontend image tag stays :latest so Argo rolls pods after CI pushes.
        paxaris.gitops/redeploy-at: "2026-05-20T11:13:33Z"
        paxaris.gitops/frontend-revision: "1dfc0e41"
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: paxo-frontend
          image: devopspaxarisglobalrepo/paxo_frontend:1dfc0e412b9c1034d34ec55073bab7ec5a51ae95
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: paxo-frontend
spec:
  selector:
    app: paxo-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
