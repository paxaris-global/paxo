apiVersion: apps/v1
kind: Deployment
metadata:
  name: paxo-frontend
spec:
  selector:
    matchLabels:
      app: paxo-frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: paxo-frontend
      annotations:
        # Bump when paxo_frontend image tag stays :latest so Argo rolls pods after CI pushes.
        paxaris.gitops/redeploy-at: "2026-05-20T10:53:54Z"
        paxaris.gitops/frontend-revision: "b734b7c2"
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: paxo-frontend
          image: devopspaxarisglobalrepo/paxo_frontend:b734b7c27f657055ced98106ea6a6aa37b55c949
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: paxo-frontend
spec:
  selector:
    app: paxo-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
