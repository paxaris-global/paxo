apiVersion: apps/v1
kind: Deployment
metadata:
  name: paxo-frontend
spec:
  selector:
    matchLabels:
      app: paxo-frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: paxo-frontend
      annotations:
        # Bump when paxo_frontend image tag stays :latest so Argo rolls pods after CI pushes.
        paxaris.gitops/redeploy-at: "2026-05-20T07:42:13Z"
        paxaris.gitops/frontend-revision: "a2f36f03"
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: paxo-frontend
          image: devopspaxarisglobalrepo/paxo_frontend:a2f36f030b20c2cd7a40150941ae8384ebe9a7bd
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: paxo-frontend
spec:
  selector:
    app: paxo-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
