apiVersion: apps/v1
kind: Deployment
metadata:
  name: test_vipul-admin-test6-test6-vipul6-frontend
  annotations:
    argocd-image-updater.argoproj.io/image-list: devopspaxarisglobalrepo/test_vipul-admin-test6-test6-vipul6-frontend
    argocd-image-updater.argoproj.io/test_vipul-admin-test6-test6-vipul6-frontend.update-strategy: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test_vipul-admin-test6-test6-vipul6-frontend
  template:
    metadata:
      labels:
        app: test_vipul-admin-test6-test6-vipul6-frontend
    spec:
      containers:
        - name: test_vipul-admin-test6-test6-vipul6-frontend
          image: devopspaxarisglobalrepo/test_vipul-admin-test6-test6-vipul6-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: test_vipul-admin-test6-test6-vipul6-frontend
spec:
  selector:
    app: test_vipul-admin-test6-test6-vipul6-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
