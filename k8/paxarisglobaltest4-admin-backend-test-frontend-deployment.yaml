apiVersion: apps/v1
kind: Deployment
metadata:
  name: paxarisglobaltest4-admin-backend-test-frontend
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=devopspaxarisglobalrepo/paxarisglobaltest4-admin-backend-test-frontend
    argocd-image-updater.argoproj.io/app.update-strategy: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paxarisglobaltest4-admin-backend-test-frontend
  template:
    metadata:
      labels:
        app: paxarisglobaltest4-admin-backend-test-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: paxarisglobaltest4-admin-backend-test-frontend
          image: devopspaxarisglobalrepo/paxarisglobaltest4-admin-backend-test-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: paxarisglobaltest4-admin-backend-test-frontend
spec:
  selector:
    app: paxarisglobaltest4-admin-backend-test-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
