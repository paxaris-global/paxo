apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-management-service
  annotations:
    argocd-image-updater.argoproj.io/image-list: "product=devopspaxarisglobalrepo/product-management-service"
    argocd-image-updater.argoproj.io/product.update-strategy: latest
spec:
  selector:
    matchLabels:
      app: product-management-service
  replicas: 1
  template:
    metadata:
      labels:
        app: product-management-service
      annotations:
        paxaris.gitops/redeploy-at: "2026-06-09T11:35:00Z"
        paxaris.gitops/pm-revision: "minikube-nodeport-32000"
    spec:
      containers:
        - name: product-management-service
          image: devopspaxarisglobalrepo/product-management-service:34b4ae7d78259abf34a82257ba9b584e1421a702
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/centralized_data?createDatabaseIfNotExist=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: SERVER_PORT
              value: "8088"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318/v1/traces
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: GITHUB_TOKEN
            - name: GITHUB_ORG
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: GITHUB_ORG

            - name: DOCKER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: DOCKER_USERNAME
            - name: DOCKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: DOCKER_PASSWORD
            - name: SHOWCASE_PLAYWRIGHT_ENABLED
              value: "false"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx768m"
            - name: PROVISIONING_EXTERNAL_HOST
              value: "auto"
            - name: PROVISIONING_BROWSER_HOST
              value: "127.0.0.1"
            - name: PROVISIONING_BROWSER_URL_MODE
              value: "proxy"
            - name: PROVISIONING_PAXO_PUBLIC_BASE_URL
              value: "http://127.0.0.1:32000"

---
apiVersion: v1
kind: Service
metadata:
  name: product-management-service
spec:
  selector:
    app: product-management-service
  ports:
    - port: 8088
      targetPort: 8088
      nodePort: 32088
  type: NodePort
