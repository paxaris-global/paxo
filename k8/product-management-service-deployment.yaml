apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-management-service
  annotations:
    argocd-image-updater.argoproj.io/image-list: "product=devopspaxarisglobalrepo/product-management-service"
    argocd-image-updater.argoproj.io/product.update-strategy: latest
spec:
  selector:
    matchLabels:
      app: product-management-service
  replicas: 1
  template:
    metadata:
      labels:
        app: product-management-service
    spec:
      containers:
        - name: product-management-service
          image: devopspaxarisglobalrepo/product-management-service:7064b6529dd22a12ad183126a2bb74badba1bad3
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/centralized_data?createDatabaseIfNotExist=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: SERVER_PORT
              value: "8088"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318/v1/traces
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: GITHUB_TOKEN
            - name: GITHUB_ORG
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: GITHUB_ORG

            - name: DOCKER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: DOCKER_USERNAME
            - name: DOCKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: DOCKER_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: product-management-service
spec:
  selector:
    app: product-management-service
  ports:
    - port: 8088
      targetPort: 8088
      nodePort: 32088
  type: NodePort
