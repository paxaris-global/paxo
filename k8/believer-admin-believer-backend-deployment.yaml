apiVersion: apps/v1
kind: Deployment
metadata:
  name: believer-admin-believer-backend
  annotations:
    argocd-image-updater.argoproj.io/image-list: "app=paxarisdocker/believer-admin-believer-backend"
    argocd-image-updater.argoproj.io/app.update-strategy: latest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: believer-admin-believer-backend
  template:
    metadata:
      labels:
        app: believer-admin-believer-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h believer-admin-believer-backend-postgres -p 5432 -U app_user; do echo waiting for postgres; sleep 2; done
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: believer-admin-believer-backend
          image: "paxarisdocker/believer-admin-believer-backend:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: DB_URL
              value: jdbc:postgresql://believer-admin-believer-backend-postgres:5432/app
            - name: DB_USERNAME
              value: app_user
            - name: DB_PASSWORD
              value: app_password
---
apiVersion: v1
kind: Service
metadata:
  name: believer-admin-believer-backend
spec:
  selector:
    app: believer-admin-believer-backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 32402
  type: NodePort
