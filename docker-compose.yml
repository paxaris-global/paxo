services:
  # -----------------------------
  # MySQL
  # -----------------------------
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: centralized_data
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - springnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  # -----------------------------
  # Keycloak
  # -----------------------------
  keycloak-server:
    image: quay.io/keycloak/keycloak:26.2.0
    container_name: keycloak-server
    command: [ "start-dev", "--http-relative-path=/" ]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin@123}
      KC_HOSTNAME: localhost       # Important: sets frontend URL for issuer
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - springnet

  # -----------------------------
  # OpenTelemetry Backend (Jaeger)
  # -----------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - springnet

    # -----------------------------
  # Identity Service
  # -----------------------------
  identity-service:
    build:
      context: ../identity_service
    image: devopspaxarisglobalrepo/identity-service:latest
    container_name: identity-service

    ports:
      - "8087:8087"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/centralized_data?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      KEYCLOAK_BASE_URL: http://keycloak-server:8080
      PROJECT_MANAGER_URL: http://project-manager:8088
      KEYCLOAK_REALM: master
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin@123}
      DOCKER_USERNAME: ${DOCKER_USERNAME}
      DOCKER_PASSWORD: ${DOCKER_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_ORG: ${GITHUB_ORG}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # ✅ REQUIRED

    depends_on:
      mysql-db:
        condition: service_healthy
      jaeger:
        condition: service_started

    networks:
      - springnet


    # -----------------------------
  # Project Manager
  # -----------------------------
  project-manager:
    build:
      context: ../product-management-service
      dockerfile: Dockerfile
    image: devopspaxarisglobalrepo/product-management-service:latest
    container_name: project-manager
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/centralized_data?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_ORG: ${GITHUB_ORG}
      SERVER_PORT: 8088
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
        - "8088:8088"
    depends_on:
      mysql-db:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - springnet
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/actuator/health || exit 1"]
      interval: 15s
      retries: 10
      timeout: 10s
      start_period: 120s

  # -----------------------------
  # API Gateway
  # -----------------------------
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    image: devopspaxarisglobalrepo/apigateway:latest
    container_name: api-gateway
    ports:
      - "8085:8085"
    environment:
      PROJECT_MANAGEMENT_BASE_URL: http://project-manager:8088
      IDENTITY_SERVICE_URL: http://identity-service:8087
      KEYCLOAK_BASE_URL: http://keycloak-server:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      mysql-db:
        condition: service_healthy
      project-manager:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - springnet
    restart: unless-stopped




  # -----------------------------
  # Angular Frontend
  # -----------------------------
  paxo-frontend:
    image: devopspaxarisglobalrepo/paxo_frontend:latest
    container_name: paxo-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - springnet
    restart: unless-stopped




